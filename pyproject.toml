[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-mcp"
version = "0.1.0"
description = "Zero-clone Model Context Protocol (MCP) server for 200,000+ ATP matches (1968-2026), Match Charting Project shot/rally metrics, H2H, and advanced analytics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Saurabh Kumar" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "tennis",
  "atp",
  "sports-analytics",
  "duckdb",
  "parquet",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=2.0.0",
  "duckdb>=1.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
tennis-mcp = "tennis_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sorukumar/tennis-mcp"
Repository = "https://github.com/sorukumar/tennis-mcp"
"Data Warehouse" = "https://github.com/sorukumar/tml-data"
"Visualizations" = "https://sorukumar.github.io/tennis-analytics/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
