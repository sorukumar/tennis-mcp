name: Publish to PyPI and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit and offline MCP tests
        run: pytest -v -k "not remote"

  pypi-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          python3 -c '
          import json, os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as f:
              py_ver = tomllib.load(f)["project"]["version"]
          with open("server.json", "r", encoding="utf-8") as f:
              srv_ver = json.load(f)["version"]
          assert tag == py_ver == srv_ver, f"Version mismatch: tag={tag}, pyproject={py_ver}, server.json={srv_ver}"
          print(f"Verified release version {tag}")
          '
      - name: Build distribution packages
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Publish package to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PyPI release metadata to propagate
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          echo "Checking PyPI for tennis-mcp==${VERSION}..."
          for i in $(seq 1 18); do
            if curl -fsS "https://pypi.org/pypi/tennis-mcp/${VERSION}/json" >/dev/null; then
              echo "PyPI release tennis-mcp==${VERSION} is live."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for PyPI release tennis-mcp==${VERSION}" >&2
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
